# Configuration git-cliff — génération du CHANGELOG.md
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

Toutes les modifications notables de ce projet sont documentées dans ce fichier.

Généré automatiquement avec [git-cliff](https://git-cliff.org).
"""
# Modèle Tera pour chaque version (ou section « Unreleased » sans tag)
body = """
{% if version %}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}
## Unreleased
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/roms-cor/byab-website/commit/{{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[git]
# Analyse des commits conventionnels (feat:, fix:, …)
conventional_commits = true
# Les commits non conventionnels sont conservés (regroupés dans « Autres »)
filter_unconventional = false
split_commits = false
# Regrouper par version si des tags v* apparaissent un jour
tag_pattern = "v[0-9].*"
sort_commits = "newest"
filter_commits = false

# L'ordre des sections suit le préfixe caché <!-- N --> (retiré au rendu)
commit_parsers = [
  # --- Bruit système Replit : exclu du changelog ---
  { message = "^Transitioned from Plan to Build mode", skip = true },
  { message = "^Published your App", skip = true },
  { message = "^Visual edit", skip = true },
  { message = "^Saved progress", skip = true },
  { message = "^Saved your changes", skip = true },
  { message = "^Git commit prior to merge", skip = true },
  { message = "^Checkpoint", skip = true },
  { message = "^Restored", skip = true },
  { message = "^Screenshot", skip = true },
  { message = "^Initial commit$", skip = true },
  # --- Commits générés par l'automatisation : exclus (anti-boucle) ---
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  # --- Types conventionnels ---
  { message = "^feat", group = "<!-- 0 -->✨ Fonctionnalités" },
  { message = "^fix", group = "<!-- 1 -->🐛 Corrections" },
  { message = "^refactor", group = "<!-- 2 -->♻️ Refactorisations" },
  { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
  { message = "^docs", group = "<!-- 4 -->📚 Documentation" },
  { message = "^style", group = "<!-- 5 -->🎨 Style" },
  { message = "^test", group = "<!-- 6 -->🧪 Tests" },
  { message = "^chore", group = "<!-- 7 -->🔧 Maintenance" },
  # --- Tout le reste : commits non conventionnels ---
  { message = ".*", group = "<!-- 8 -->Autres" },
]
