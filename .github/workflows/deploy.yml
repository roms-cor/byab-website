name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore(release)')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10.8.x on Node 20 intermittently crashed with "Exit handler never
      # called!" while still exiting 0, leaving node_modules empty and the
      # build failing with "tsx: not found". Node 22 ships a fixed npm; the
      # verify + retry below makes any future silent install failure loud.
      - name: Install dependencies
        run: |
          npm ci --no-audit --no-fund || {
            echo "::warning::npm ci crashed — dumping npm debug log, then retrying with --ignore-scripts"
            tail -n 80 /home/runner/.npm/_logs/*-debug-0.log || true
            rm -rf node_modules
            # Lifecycle scripts are not needed for the static site build:
            # esbuild/rollup binaries arrive via optionalDependencies, and
            # bufferutil/git-cliff are unused by `npm run build`.
            npm ci --no-audit --no-fund --ignore-scripts
          }
          # Fail loudly if the install silently left node_modules unusable
          # (npm has crashed with "Exit handler never called!" but exit 0).
          npx tsx --version

      - name: Build
        run: npm run build

      - name: Copy CNAME to dist
        run: cp CNAME dist/public/CNAME

      - name: SPA fallback for client-side routing
        run: cp dist/public/index.html dist/public/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
